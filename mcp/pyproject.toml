[project]
name = "ravenstack-keep-mcp"
version = "0.1.0"
description = "Ravenstack Keep MCP — Phase-1 control plane + spatial telemetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0.0",
  "jsonschema>=4.20.0",
]

[project.scripts]
ravenstack-keep-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = false
