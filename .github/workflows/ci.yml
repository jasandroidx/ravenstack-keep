name: CI

on:
  push:
    branches: [main, ravenstack]
  pull_request:

jobs:
  ui-v2:
    name: ui-v2 typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking: 2 known errors from @google/genai@0.2.0 missing the
      # imageConfig field on GenerateContentConfig (ai.ts:334,365) — needs an
      # SDK-version decision, not a CI-config workaround. Flip to blocking
      # once that's resolved.
      - name: Typecheck
        run: npm run typecheck --workspace=ui-v2
        continue-on-error: true

      - name: Lint
        run: npm run lint --workspace=ui-v2

      - name: Test
        run: npm test --workspace=ui-v2

      - name: Build (dev mode, no DB migration)
        run: npm run build:dev --workspace=ui-v2
